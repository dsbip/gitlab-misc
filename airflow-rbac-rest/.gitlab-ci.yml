# GitLab CI: sync Airflow (Cloud Composer) DAG-level RBAC via the Airflow REST
# API (the CLI RBAC-mutation commands are blocked by Composer).
#
# Runs every hour via a pipeline schedule and reconciles Airflow to the config:
# for each DAG in a role it grants the capability bundle (view DAG / DAG code /
# DAG runs, create & edit DAG runs, view task instances & logs), grants the role
# to the listed users, and strips "Op"/"Admin". Idempotent - no-ops when in sync.
#
# ---------------------------------------------------------------------------
# Run it every hour: add a pipeline schedule (CI/CD > Schedules), cron: 0 * * * *
# ---------------------------------------------------------------------------
# CI/CD variables (Settings > CI/CD > Variables):
#   COMPOSER_PROJECT       GCP project id of the Composer environment
#   COMPOSER_LOCATION      Composer region (e.g. europe-west2)
#   COMPOSER_ENVIRONMENT   Composer environment name
#   WIF_PROVIDER_URL / WIF_SERVICE_ACCOUNT  (optional) Workload Identity Federation;
#                          if unset, the job relies on the runner's gcloud auth.
#   WIF_AUDIENCE           (optional) aud for the id_token, if using WIF.
#
# The authenticated identity must map to the Airflow **Admin** role (RBAC writes
# via the REST API require it).

stages:
  - rbac

variables:
  RBAC_CONFIG: "airflow-rbac-rest/rbac_config.yml"

airflow-rbac-sync-rest:
  stage: rbac
  image: google/cloud-sdk:slim

  id_tokens:
    GCP_ID_TOKEN:
      aud: "${WIF_AUDIENCE}"

  before_script:
    - apt-get update -qq && apt-get install -y -qq jq curl python3-yaml >/dev/null
    - chmod +x airflow-rbac-rest/airflow_rbac_sync.sh
    - |
      if [ -n "${WIF_PROVIDER_URL:-}" ] && [ -n "${WIF_SERVICE_ACCOUNT:-}" ]; then
        printf '%s' "$GCP_ID_TOKEN" > /tmp/oidc_token
        gcloud iam workload-identity-pools create-cred-config "$WIF_PROVIDER_URL" \
          --service-account="$WIF_SERVICE_ACCOUNT" \
          --service-account-token-lifetime-seconds=3600 \
          --output-file=/tmp/cred.json --credential-source-file=/tmp/oidc_token
        gcloud auth login --cred-file=/tmp/cred.json --quiet
      fi
    - gcloud config set project "$COMPOSER_PROJECT" --quiet

  script:
    - airflow-rbac-rest/airflow_rbac_sync.sh
        --config "$RBAC_CONFIG"
        --project "$COMPOSER_PROJECT"
        --location "$COMPOSER_LOCATION"
        --environment "$COMPOSER_ENVIRONMENT"

  after_script:
    - gcloud auth revoke --all --quiet 2>/dev/null || true
    - rm -f /tmp/oidc_token /tmp/cred.json 2>/dev/null || true

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - when: manual
      allow_failure: true
