# GitLab CI: inventory Cloud Composer DAGs across MULTIPLE GCP projects in a
# single job, authenticating to each project with Workload Identity Federation
# (WIF) and revoking the credentials before moving to the next one.
#
# All results are appended into ONE combined CSV artifact.
#
# ---------------------------------------------------------------------------
# How to use this file
# ---------------------------------------------------------------------------
# GitLab reads one CI config per project. Either:
#   a) Settings > CI/CD > General pipelines > "CI/CD configuration file" ->
#      single-run/.gitlab-ci.yml
#   b) or add to the root .gitlab-ci.yml:
#        include:
#          - local: single-run/.gitlab-ci.yml
#
# ---------------------------------------------------------------------------
# Configuring projects
# ---------------------------------------------------------------------------
# single-run/projects.yml lists the projects, but holds NO WIF values - each
# entry only NAMES the CI/CD variables to read. The actual values live in
# Settings > CI/CD > Variables:
#
#   WIF_PROVIDER_URL_A    -> projects/<NUMBER>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>
#                            (the provider resource path, no https:// scheme)
#   WIF_SERVICE_ACCOUNT_A -> composer-inventory@composer-project-a.iam.gserviceaccount.com
#   WIF_PROVIDER_URL_B / WIF_SERVICE_ACCOUNT_B -> same for project B, etc.
#   WIF_AUDIENCE          -> the audience every provider accepts (see below)
#
# Entries that omit wif_provider_url_var / wif_service_account_var default to
# the variables WIF_PROVIDER_URL / WIF_SERVICE_ACCOUNT, so a fleet sharing one
# provider+SA defines just those two. `location` is optional too and defaults
# to europe-west2.
#
# ---------------------------------------------------------------------------
# The OIDC id_token
# ---------------------------------------------------------------------------
# GitLab CANNOT create id_tokens dynamically inside a loop - the `aud` is
# resolved when the pipeline is created. So ONE token is declared below and
# used for every project; ID_TOKEN_VAR (a plain variable) tells the script
# which one to read.
#
# >> IMPORTANT: a token carries exactly one `aud`, so EVERY project's WIF
# >> provider must be configured to accept WIF_AUDIENCE below. Set each
# >> provider's allowed audience to that same value.
#
# WIF_AUDIENCE is a CI/CD variable, conventionally:
#   https://iam.googleapis.com/projects/<NUMBER>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>
# (GitLab 16.1+ expands variables in `aud`; on older GitLab hardcode it.)
#
# Each project's service account needs roles/composer.user, and its WIF provider
# must trust this GitLab project (attribute condition on e.g.
# assertion.project_path == "group/repo").

stages:
  - inventory

# ---------------------------------------------------------------------------
# Runtime parameters (prefilled on the "Run pipeline" form)
# ---------------------------------------------------------------------------
# Leave both blank to inventory every project in projects.yml.
#   PROJECT_ID only              -> that project, ALL of its Composer instances
#   PROJECT_ID + COMPOSER_INSTANCE -> that project, ONLY that Composer instance
# PROJECT_ID must still be listed in projects.yml (that is where its WIF
# provider/service account come from).
variables:
  PROJECT_ID:
    value: ""
    description: "Optional. Inventory only this GCP project (must exist in single-run/projects.yml). Blank = all projects."
  COMPOSER_INSTANCE:
    value: ""
    description: "Optional. Inventory only this Composer environment name. Requires PROJECT_ID."

composer-dag-inventory-all-projects:
  stage: inventory
  image: google/cloud-sdk:slim

  # A single token, shared by every project. Its name must match ID_TOKEN_VAR
  # below, and every project's WIF provider must accept this aud.
  id_tokens:
    GCP_ID_TOKEN:
      aud: "$WIF_AUDIENCE"

  variables:
    TARGETS_FILE: "single-run/projects.yml"
    OUTPUT_CSV: "composer_dags_all_projects.csv"
    # Static: names the id_token declared above, read by the runner script.
    ID_TOKEN_VAR: "GCP_ID_TOKEN"

  before_script:
    # jq + curl: used by the inventory script. python3-yaml: reads projects.yml.
    - apt-get update -qq && apt-get install -y -qq jq curl python3-yaml >/dev/null
    - chmod +x single-run/run_multi_project_inventory.sh composer-dag-inventory/list_composer_dags.sh

  # PROJECT_ID / COMPOSER_INSTANCE are picked up from the environment by the
  # runner, so a blank value simply means "no filter".
  script:
    - single-run/run_multi_project_inventory.sh
        --config "$TARGETS_FILE"
        --output "$OUTPUT_CSV"
        --inventory composer-dag-inventory/list_composer_dags.sh

  artifacts:
    name: "composer-dags-all-projects-${CI_COMMIT_SHORT_SHA}"
    paths:
      - composer_dags_all_projects.csv
    expire_in: 30 days
    # Publish the CSV even if some projects failed.
    when: always

  rules:
    # Run automatically for scheduled pipelines...
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    # ...and offer a manual "play" button everywhere else.
    - when: manual
      allow_failure: true
