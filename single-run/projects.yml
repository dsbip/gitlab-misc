# Composer projects to inventory.
#
# WIF connection details are NOT stored in this file. The provider URL and
# service account live in GitLab CI/CD variables (Settings > CI/CD > Variables);
# each entry here only names WHICH variables to read at runtime.
#
# Fields per entry:
#   project_id               (required) GCP project id holding the Composer environments.
#   wif_provider_url_var     (optional) Name of the CI/CD variable holding the WIF
#                            provider resource path, WITHOUT a scheme:
#                              projects/<NUMBER>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>
#                            Default: WIF_PROVIDER_URL.
#   wif_service_account_var  (optional) Name of the CI/CD variable holding the service
#                            account to impersonate, e.g.
#                              composer-inventory@<project>.iam.gserviceaccount.com
#                            Default: WIF_SERVICE_ACCOUNT.
#   location                 (optional) Composer region. Default: europe-west2.
#
# The OIDC id_token is NOT configured per project. The pipeline sets a single
# ID_TOKEN_VAR environment variable (default: GCP_ID_TOKEN) naming the token
# declared under `id_tokens:` in .gitlab-ci.yml, and every project uses it.
# NOTE: a token carries exactly one `aud`, so every project's WIF provider must
# be configured to accept that same audience.

projects:
  - project_id: composer-project-a
    wif_provider_url_var: WIF_PROVIDER_URL_A
    wif_service_account_var: WIF_SERVICE_ACCOUNT_A

  - project_id: composer-project-b
    wif_provider_url_var: WIF_PROVIDER_URL_B
    wif_service_account_var: WIF_SERVICE_ACCOUNT_B

  # Projects sharing ONE WIF provider + service account can omit both *_var
  # fields - they default to WIF_PROVIDER_URL / WIF_SERVICE_ACCOUNT, so you
  # define those two variables once.
  #
  # `location` is optional; omit it for europe-west2, or set it per project:
  # - project_id: composer-project-c
  #   location: us-central1
